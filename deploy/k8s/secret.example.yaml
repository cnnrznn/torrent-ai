# Copy, fill in and apply; don't commit real values. Or create it with:
#   kubectl create secret generic torrentai --from-literal=api-token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: torrentai
type: Opaque
stringData:
  api-token: change-me
  # For Grafana Cloud Profiles: the stack's profiles instance ID and an
  # access policy token with profiles:write. Reference them from the
  # StatefulSet as TORRENT_AI_PYROSCOPE_USER and
  # TORRENT_AI_PYROSCOPE_PASSWORD. A homelab Pyroscope needs neither.
  # pyroscope-user: "123456"
  # pyroscope-password: glc_...
